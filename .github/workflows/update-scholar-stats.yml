name: Update Google Scholar stats

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"  # daily 06:15 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install cheerio@1

      - name: Fetch Scholar stats
        run: node .github/scripts/fetch-scholar-stats.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Google Scholar stats"
            git push
          fi
