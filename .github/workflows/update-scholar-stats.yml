name: Update Google Scholar stats

on:
  schedule:
    - cron: "15 6 * * *"  # daily at 06:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm init -y
          npm i cheerio@1

      - name: Fetch Scholar stats
        run: node .github/scripts/fetch-scholar-stats.js
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_stats.json
          git diff --staged --quiet || (git commit -m "Update Google Scholar stats" && git push)
